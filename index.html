<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DnD Shop</title>
    <style>
      body {
        background-image: url('Publiii.png');
        background-size: cover;
        background-attachment: fixed;
      }
      p {
        font-size: 150%;
        margin: 3%;
      }
      div {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #hoverDiv {
        left: 48%;
        top: 48%;
        width: 50%;
        height: 48%;
        background: white;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="hoverDiv">
      <p id="hoverP"></p>
    </div>
    <script src="adventuringGear.js"></script>
    <script src="armor.js"></script>
    <script src="magic.js"></script>
    <script src="poisons.js"></script>
    <script src="potions.js"></script>
    <script src="toolsAndKits.js"></script>
    <script src="weapons.js"></script>
    <script src="script.js"></script>
  </body>
</html>
